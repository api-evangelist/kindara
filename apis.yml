name: Kindara
description: Kindara is a fertility-awareness and reproductive-health company offering a digital
  fertility charting system across web (app.kindara.com) and iOS/Android mobile apps. It lets users
  track basal body temperature, cervical fluid, and menstrual cycle data to understand their fertility,
  time conception, or practice fertility-awareness-based birth control. Kindara pairs its charting app
  with the Wink basal thermometer and was surfaced as a 500 Global portfolio company. It is a
  consumer-facing femtech product and publishes no public developer API, SDK, or documentation surface
  as of this enrichment pass.
